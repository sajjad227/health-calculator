!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحاسبة الصحية الشاملة - السعرات والوزن المثالي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #219653;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background: #e8f8f5;
            border-right: 5px solid #27ae60;
            border-radius: 6px;
            display: none;
        }
        .result-box h3 {
            color: #27ae60;
            margin-bottom: 10px;
        }
        .result-item {
            margin-bottom: 8px;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🍎 الحاسبة الصحية الشاملة</h2>
    
    <div class="form-group">
        <label for="age">العمر (سنوات):</label>
        <input type="number" id="age" placeholder="مثال: 25">
    </div>

    <div class="form-group">
        <label for="gender">الجنس:</label>
        <select id="gender">
            <option value="male">ذكر</option>
            <option value="female">أنثى</option>
        </select>
    </div>

    <div class="form-group">
        <label for="weight">الوزن الحالي (كجم):</label>
        <input type="number" id="weight" placeholder="مثال: 70">
    </div>

    <div class="form-group">
        <label for="height">الطول (سم):</label>
        <input type="number" id="height" placeholder="مثال: 175">
    </div>

    <div class="form-group">
        <label for="activity">مستوى النشاط البدني:</label>
        <select id="activity">
            <option value="1.2">قليل الحركة (بدون تمارين)</option>
            <option value="1.375">خفيف النشاط (تمارين خفيفة 1-3 أيام أسبوعياً)</option>
            <option value="1.55">متوسط النشاط (تمارين متوسطة 3-5 أيام أسبوعياً)</option>
            <option value="1.725">عالي النشاط (تمارين مكثفة 6-7 أيام أسبوعياً)</option>
        </select>
    </div>

    <button onclick="calculateHealth()">احسب الآن</button>

    <div class="result-box" id="resultBox">
        <h3>📊 نتائج تقييمك الصحي:</h3>
        <div class="result-item" id="bmiResult"></div>
        <div class="result-item" id="idealWeightResult"></div>
        <div class="result-item" id="caloriesResult"></div>
    </div>
</div>

<script>
function calculateHealth() {
    const age = parseFloat(document.getElementById('age').value);
    const gender = document.getElementById('gender').value;
    const weight = parseFloat(document.getElementById('weight').value);
    const height = parseFloat(document.getElementById('height').value);
    const activity = parseFloat(document.getElementById('activity').value);

    if (!age || !weight || !height) {
        alert('الرجاء إدخال العمر، الوزن، والطول بشكل صحيح!');
        return;
    }

    // 1. حساب مؤشر كتلة الجسم (BMI)
    const heightInMeters = height / 100;
    const bmi = (weight / (heightInMeters * heightInMeters)).toFixed(1);
    let bmiStatus = '';
    if (bmi < 18.5) bmiStatus = 'نحافة';
    else if (bmi >= 18.5 && bmi < 25) bmiStatus = 'وزن طبيعي وصحي ✅';
    else if (bmi >= 25 && bmi < 30) bmiStatus = 'زيادة في الوزن';
    else bmiStatus = 'سمنة';

    // 2. حساب الوزن المثالي تقريبياً (معادلة ميلر)
    let idealWeight = 0;
    if (gender === 'male') {
        idealWeight = 56.2 + 1.41 * ((height - 152.4) / 2.54);
    } else {
        idealWeight = 53.1 + 1.36 * ((height - 152.4) / 2.54);
    }

    // 3. حساب السعرات الحرارية (معادلة Mifflin-St Jeor)
    let bmr = (10 * weight) + (6.25 * height) - (5 * age);
    if (gender === 'male') {
        bmr += 5;
    } else {
        bmr -= 161;
    }
    const maintenanceCalories = Math.round(bmr * activity);
    const loseWeightCalories = maintenanceCalories - 500; // لنقصان الوزن
    const gainWeightCalories = maintenanceCalories + 500; // لزيادة الوزن

    // عرض النتائج
    const resultBox = document.getElementById('resultBox');
    resultBox.style.display = 'block';

    document.getElementById('bmiResult').innerHTML = `<b>• مؤشر كتلة الجسم (BMI):</b> ${bmi} (${bmiStatus})`;
    document.getElementById('idealWeightResult').innerHTML = `<b>• الوزن المثالي التقريبي:</b> ${idealWeight.toFixed(1)} كجم`;
    document.getElementById('caloriesResult').innerHTML = `<b>• السعرات للحفاظ على الوزن:</b> ${maintenanceCalories} سعرة حرارية<br>` +
                                                        `<b>• السعرات لنقصان الوزن:</b> ${loseWeightCalories} سعرة حرارية<br>` +
                                                        `<b>• السعرات لزيادة الوزن:</b> ${gainWeightCalories} سعرة حرارية`;
}
</script>

</body>
</html>
